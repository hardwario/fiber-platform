[package]
name = "fiber-agent"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The HARDWARIO FIBER on-device software in one binary, `fiber`: the platform tool that applies the chosen components, the agent that presents the board over MQTT, and the command line to query and command it."

[[bin]]
name = "fiber"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fiber-protocol = { path = "../crates/protocol" }
fiber-south-core = { path = "../crates/south-core" }
fiber-flasher = { path = "../crates/flasher" }
anyhow.workspace = true
tokio.workspace = true
rumqttc.workspace = true
tokio-serial.workspace = true
toml.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
# The radio application schema of TOWER nodes (their messages, property tables and schema tag),
# at the pinned TOWER revision: the agent decodes what the north bridge forwards untouched.
tower-protocol.workspace = true
# The front panel: the 1-bit framebuffer and fonts the LCD's picture is drawn with, and the
# buttons' gestures (click, hold, repeat), at the pinned TOWER revision.
tower-hmi.workspace = true
# The local time zone for the front panel's clock: /etc/localtime (TZif and its rule), in pure Rust
# (no unsafe, no dependencies).
tz-rs = "0.7"

[dev-dependencies]
# A node's Report, built in the radio's tests: the version tower-protocol uses.
heapless = "0.9"
# A paused clock for the tests of the agent's loop.
tokio = { workspace = true, features = ["test-util"] }

# The GPIO lines (BOOT0 and NRST of the two microcontrollers), through the kernel's character
# device: Linux only. Elsewhere the agent builds for its tests, without lines.
[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8"
# The LCD on /dev/spidev6.0: its mode and speed are set by ioctl.
spidev = "0.7"
