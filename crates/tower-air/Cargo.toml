[package]
name = "fiber-tower-air"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "no_std, hardware-free side of the FIBER north bridge's TOWER personality: the software packet codec (whitening, length, CRC), the on-air frame codec and the gateway flow, over a radio trait and the pinned tower-net / tower-radio kernels. Host-tested; the STM32WL55 firmware in firmware/north supplies the radio."

[lints]
workspace = true

[dependencies]
# The pinned TOWER kernels (the one `rev` in the root Cargo.toml): the security decisions
# (replay, TX counter, ACK, nonce, pairing) and the radio arithmetic (CCM, duty, time on air) are
# TOWER's own code, so the two stacks cannot disagree about them.
tower-net.workspace = true
tower-radio.workspace = true
