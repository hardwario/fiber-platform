# The components of the FIBER platform: what each brings, what it needs, and where it listens.
#
# The `fiber` program is built with this file in it, and works out requirements from it. FIBER
# Setup builds its picker from a copy of it. A component's id is what `/etc/fiber/platform.yaml`
# and `fiber platform enable` name.
#
# For each component:
#   title     : its name on a screen
#   about     : what it brings, in one sentence of plain text (it is shown on a screen)
#   roles     : the Ansible roles that bring it up, in order
#   requires  : components that are brought up with it
#   suggests  : components that go well with it; nothing turns them on
#   services  : its systemd units
#   ports     : where it listens: `loopback` (the FIBER itself) or `network`, and the setting
#               that opens the port, if one does
#   size      : download and installed size in MB, as measured on a FIBER (2026-11-19, T12): the
#               packages and files the component brings, with what they pull in. Not counted: the
#               release itself (2 MB, 6 MB installed) and Ansible (4 MB, 26 MB installed), which
#               every installation brings; apt keeps the packages it downloaded besides
schema: 1
components:
  base:
    title: Basic system configuration
    about: The config.txt block, the 1-Wire overlay, the i2c-dev module and the groups, so that the board works as plain Linux.
    roles: [base]
    size: { download: 0, installed: 0 }
  mosquitto:
    title: Mosquitto
    about: Mosquitto, the broker everything on the FIBER talks through.
    roles: [mosquitto]
    services: [mosquitto]
    ports:
      - { port: 1883, listen: loopback }
      - { port: 1884, listen: network, when: mqtt.lan }
    size: { download: 1, installed: 2 }
  agent:
    title: FIBER agent
    about: The service that shows the board, the front panel and the radio on MQTT.
    roles: [agent]
    requires: [base, mosquitto]
    services: [fiber-agent]
    # The program is in the release.
    size: { download: 0, installed: 0 }
  node-red:
    title: Node-RED
    about: Node.js, Node-RED and its dashboard, with a starter flow on the local broker.
    roles: [node_red]
    requires: [mosquitto]
    suggests: [agent]
    services: [nodered]
    ports:
      - { port: 1880, listen: network }
    # Node.js 37 MB (231 MB installed), Node-RED 43 MB (123 MB), the dashboard 35 MB (136 MB).
    size: { download: 115, installed: 490 }
  chirpstack:
    title: ChirpStack
    about: A LoRaWAN network server, and the gateway when a RAK5146 card is in the mini-PCIe slot.
    roles: [chirpstack]
    requires: [mosquitto]
    # chirpstack-sqlite's unit is chirpstack-sqlite.service (read from its package 4.20.0,
    # 2026-11-17).
    services: [chirpstack-sqlite, chirpstack-mqtt-forwarder, redis-server, fiber-concentratord]
    ports:
      - { port: 8080, listen: network }
    size: { download: 17, installed: 68 }
