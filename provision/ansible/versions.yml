---
# Every version the roles pin, in one place (docs/provisioning.md, "Sources").
fiber_versions:
  # The ansible-core the roles are written for: Debian trixie's.
  ansible_core: "2.19"
  # Node.js from NodeSource (node_24.x): Debian's Node.js 20 is too old for Node-RED 5, which asks
  # for 22.9 or newer.
  nodejs_major: 24
  # Node-RED from npm; checked 2026-11-17 (the newest then).
  node_red: "5.0.10"
  # ChirpStack's package source keeps one version of each package, so only the major is pinned.
  chirpstack_major: 4
  # The concentrator daemon for the RAK5146 (SX1302), a tarball checked by its sha256.
  concentratord: "4.7.1"
  concentratord_sha256: "328faf7e6fe6fcc9f5a50f8368fd520807ac2939214c607593318e017e857345"
