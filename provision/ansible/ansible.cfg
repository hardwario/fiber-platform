# Ansible's settings for the FIBER platform. `fiber platform apply` points ANSIBLE_CONFIG here;
# relative paths are relative to this file.
[defaults]
# Facts only where a role asks for them: gathering all of them takes seconds on a CM4, and there
# is one run for every component.
gathering = explicit
forks = 1
# Temporary files under /run, not in root's home.
local_tmp = /run/fiber/platform/ansible
remote_tmp = /run/fiber/platform/ansible
# ansible.builtin only: the collections path is an empty directory of the release, and the
# system's own Python paths are not searched.
collections_path = collections
collections_scan_sys_path = false
roles_path = roles
retry_files_enabled = false
interpreter_python = /usr/bin/python3
nocolor = true
