---
# Turned off: stopped and not started with the FIBER. Node-RED, its settings and its flows stay.
- name: Whether the service nodered is there
  ansible.builtin.stat:
    path: /etc/systemd/system/nodered.service
  register: node_red_unit

- name: Node-RED stopped and turned off
  ansible.builtin.systemd_service:
    name: nodered
    state: stopped
    enabled: false
  when: node_red_unit.stat.exists
