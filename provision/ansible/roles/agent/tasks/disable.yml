---
# Turned off: the agent stopped and not started with the FIBER. Its settings and the user stay.
# Both microcontrollers keep their firmware; the south bridge shows its fallback pattern.
- name: Whether the agent's service is there
  ansible.builtin.stat:
    path: /etc/systemd/system/fiber-agent.service
  register: agent_unit

- name: The agent stopped and turned off
  ansible.builtin.systemd_service:
    name: fiber-agent
    state: stopped
    enabled: false
  when: agent_unit.stat.exists

- name: Whether the restart's watch is there
  ansible.builtin.stat:
    path: /etc/systemd/system/fiber-restart.path
  register: agent_restart_unit

- name: The restart's watch stopped and turned off
  ansible.builtin.systemd_service:
    name: fiber-restart.path
    state: stopped
    enabled: false
  when: agent_restart_unit.stat.exists
