# Bench (T22): the north bridge's radio as TOWER's radio sends, without a TOWER node: brought up,
# listening raw on EU 868 channel 0, the noise floor measured. A workspace of its own, built inside
# this directory; plain registers through the PAC, nothing else. Not part of `just check`.
[package]
name = "fiber-radio-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/hardwario/fiber-platform"
publish = false

[workspace]
resolver = "3"

[dependencies]
stm32-metapac = { version = "21.0.0", features = ["stm32wl55jc-cm4"] }
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2

[profile.dev]
opt-level = "s"
panic = "abort"
