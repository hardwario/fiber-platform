# Bench (T22, T23): the north bridge's radio as TOWER's radio sends, against TOWER Core Modules. A
# workspace of its own, built inside this directory: plain registers through the PAC for the board,
# and the host workspace's fiber-subghz and fiber-tower-air by path. `just check-hil` lints it.
[package]
name = "fiber-radio-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/hardwario/fiber-platform"
publish = false

[workspace]
resolver = "3"

[dependencies]
# The radio's commands and TOWER's packet, as the north bridge's firmware will use them (T23).
fiber-subghz = { path = "../../crates/subghz" }
fiber-tower-air = { path = "../../crates/tower-air" }
stm32-metapac = { version = "21.0.0", features = ["stm32wl55jc-cm4"] }
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2

[profile.dev]
opt-level = "s"
panic = "abort"
