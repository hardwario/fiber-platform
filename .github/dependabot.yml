# Dependabot version updates. Weekly, grouped, with a 7-day cooldown so a freshly published
# (possibly compromised) release is never picked up the day it appears. The GitHub Actions are
# pinned to full commit SHAs with a `# vX.Y.Z` comment; Dependabot bumps the SHA and the comment
# together.
#
# The TOWER pin (the `rev` of the tower-* crates in Cargo.toml) is NOT Dependabot's to move:
# TOWER promises no wire compatibility between revisions, so moving the pin is a task with a
# drift report and a bench run (docs/architecture.md, "Two radio stacks").
version: 2
updates:
  # The host workspace: Cargo.lock at the root (crates/*, agent).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "tower-*"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # rust-toolchain.toml `channel`. The workflows pin the same version in RUST_TOOLCHAIN (env) and
  # ci.yml's `audit` job fails while they differ, so push the matching RUST_TOOLCHAIN bump onto
  # the PR. The channel also has to satisfy the pinned TOWER crates' `rust-version`.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
