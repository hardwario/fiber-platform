# The weekly canary: converge every component against the live package sources (Debian,
# NodeSource, npm, ChirpStack), as a new FIBER would today, and check the package sources' keys
# that the roles carry. A source that breaks shows up here before it shows up on a FIBER.
#
# A failed scheduled run opens an issue, or comments on the one still open: the `report` job, the
# only one here with rights to write (TASKS.md, D22). A run started by hand only fails on the
# Actions page, where the person who started it looks.

name: Canary

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # MUST equal `channel` in rust-toolchain.toml (ci.yml's `audit` job enforces it).
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  converge:
    name: Converge every component against the live sources
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + aarch64 musl, thumbv6m
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-musl, thumbv6m-none-eabi
          components: llvm-tools
      # The program carries the south bridge's firmware, which is linked with flip-link.
      - name: Install flip-link
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: flip-link@0.1.12
      - name: Install dtc
        run: sudo apt-get install -y --no-install-recommends device-tree-compiler
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - name: The keys the roles carry are valid for 60 more days
        run: just check-keys
      - name: just check-converge
        run: just check-converge

  # The only job of this workflow that may write (D22).
  report:
    name: Open an issue when it failed
    needs: converge
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: An issue, or a comment on the one still open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: a package source or a key broke"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf '%s\n\n%s\n' \
              "The weekly canary failed: $RUN_URL" \
              "A component did not converge against the live package sources, or a key the roles carry expires within 60 days. Close this issue once it is fixed.")"
          fi
