# CI for the HARDWARIO FIBER platform.
#
# The HOST workspace at the root (crates/*, agent), and the two firmware workspaces
# (firmware/south, firmware/north), each with a job of its own. There is no
# hardware in CI; the `fiber` program for the FIBER is built for arm64 and run in a container on
# an arm64 runner.
#
# `just check` runs the same gates locally.
#
# Supply chain: every action is pinned to a full commit SHA (the comment names the release;
# Dependabot keeps them current), the workflow token is read-only, checkouts don't persist it,
# every cargo invocation is `--locked` to the committed Cargo.lock, and RustSec advisories are
# checked (`audit`).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of a pull request. Every commit pushed to main gets its own group, so
# its run always finishes: a release needs a successful CI run on the exact commit it tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # MUST equal `channel` in rust-toolchain.toml (the `audit` job enforces it), so CI builds with
  # exactly the toolchain a local checkout uses. Bump both together.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  # 1. The host workspace: the shared crates and the `fiber` binary.
  host:
    name: host workspace (fmt, clippy, test, no_std build, rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + its targets
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-musl, thumbv6m-none-eabi, thumbv7em-none-eabi
          components: rustfmt, clippy, llvm-tools
      # The release build compiles the 1-Wire overlay (provision/release.py).
      - name: Install dtc
        run: sudo apt-get install -y --no-install-recommends device-tree-compiler
      # The program for the FIBER carries the south bridge's firmware, linked with flip-link.
      - name: Install flip-link
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: flip-link@0.1.12
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # The pinned TOWER kernels and our own no_std crates must build for the north bridge
      # (STM32WL55, Cortex-M4 without FPU) and the south bridge (STM32C031, Cortex-M0+).
      - name: no_std build of the shared crates (thumbv7em, thumbv6m)
        run: |
          cargo build --locked --target thumbv7em-none-eabi -p fiber-tower-air -p fiber-protocol -p fiber-subghz
          cargo build --locked --target thumbv6m-none-eabi -p fiber-protocol
      - name: rustdoc (-D warnings)
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      # The `fiber` program as it goes onto a FIBER: arm64 Linux, linked statically by rust-lld.
      - name: the FIBER's build (aarch64 musl, static)
        run: |
          just build-fiber
          file target/aarch64-unknown-linux-musl/release/fiber | tee /dev/stderr | grep -q "statically linked"
      # The release archive, built twice from the same inputs, must be the same byte for byte.
      - name: release archive is reproducible
        run: just check-release
      # The examples (docs/examples.md): the Rust one is a project of its own.
      - name: examples (fmt, clippy, parsed)
        run: just check-examples
      - name: shellcheck
        run: just shellcheck
      # The bench scripts: the probe against a fake ROM bootloader, the radio spike built and linted.
      - name: bench scripts self-test (no hardware)
        run: just check-hil
      # AGENTS.md, "Writing style".
      - name: no long dashes
        run: just no-dashes

  # 2. The south bridge's firmware: a workspace of its own (firmware/south), built for its chip
  #    with flip-link and checked against its budget of 24 KB of flash.
  south:
    name: south bridge firmware (fmt, clippy, rustdoc, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + thumbv6m
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy, llvm-tools
      - name: Install flip-link
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: flip-link@0.1.12
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware/south -> target
      - name: just check-south
        run: just check-south

  # 2b. The north bridge's firmware: a workspace of its own (firmware/north), built for its chip
  #     with flip-link; its TOWER crates must be the root's pin.
  north:
    name: north bridge firmware (fmt, clippy, rustdoc, the TOWER pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + thumbv7em
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabi
          components: rustfmt, clippy
      - name: Install flip-link
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: flip-link@0.1.12
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware/north -> target
      - name: just check-north
        run: just check-north

  # 3. On an arm64 machine, in containers: the static `fiber` program in a bare Debian container
  #    (no broker, no hardware, no settings; `just check-container`); the installer in a
  #    container like Raspberry Pi OS (`just check-install`); the playbook and the roles linted
  #    (`just lint-ansible`); and the converge test in a container with systemd running
  #    (`just check-converge`). provision/tests/ has the scripts.
  arm64:
    name: arm64 containers (the program, the installer, the roles)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml pin) + aarch64 musl, thumbv6m, thumbv7em
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-musl, thumbv6m-none-eabi, thumbv7em-none-eabi
          components: llvm-tools
      # The program carries both bridges' firmware, which is linked with flip-link.
      - name: Install flip-link
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: flip-link@0.1.12
      # The release build compiles the 1-Wire overlay (provision/release.py).
      - name: Install dtc
        run: sudo apt-get install -y --no-install-recommends device-tree-compiler
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: just check-container
        run: just check-container
      - name: just check-install
        run: just check-install
      - name: just lint-ansible
        run: just lint-ansible
      - name: just check-converge
        run: just check-converge

  # 4. RustSec advisories for the lockfile, and the toolchain pin. Vulnerabilities fail the job;
  #    informational warnings (unmaintained / unsound / yanked) are printed but do not.
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CI toolchain == rust-toolchain.toml
        run: |
          want="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          for wf in .github/workflows/*.yml; do
            if ! grep -q "RUST_TOOLCHAIN: \"$want\"" "$wf"; then
              echo "::error::$wf does not set RUST_TOOLCHAIN \"$want\" (rust-toolchain.toml); bump every workflow together"
              exit 1
            fi
          done
      - name: Install cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit@0.22.2
      # `cargo-audit audit`, not `cargo audit`: it only reads the lockfile, so no toolchain is
      # needed (the `cargo` proxy would otherwise resolve rust-toolchain.toml).
      - name: cargo audit
        run: |
          cargo-audit audit
          cargo-audit audit --file firmware/south/Cargo.lock
          cargo-audit audit --file firmware/north/Cargo.lock
          cargo-audit audit --file examples/rust/Cargo.lock
          cargo-audit audit --file hil/radio-spike/Cargo.lock
