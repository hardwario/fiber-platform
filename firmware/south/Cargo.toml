# The south bridge's firmware (STM32C031C6): the status lights, the power of the 1-Wire ports and
# two voltages (docs/firmware/south.md). A workspace of its own, built inside this directory, so
# that its target, its linker and its profile apply (.cargo/config.toml); the logic and the
# messages are the host workspace's crates, by path.
[package]
name = "fiber-south"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/hardwario/fiber-platform"
publish = false

[workspace]
resolver = "3"

[dependencies]
fiber-protocol = { path = "../../crates/protocol" }
fiber-south-core = { path = "../../crates/south-core" }

# The versions TOWER's firmware uses (docs/bench-checks.md, check 5).
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32c031c6", "memory-x", "time-driver-any", "unstable-pac"] }
embassy-sync = "0.8.0"
embedded-io-async = "0.7.0"
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

# The size: check 5 of docs/bench-checks.md. Debug information stays in the ELF only.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2

[profile.dev]
opt-level = "z"
panic = "abort"
