# Mosquitto MQTT Broker — FIBER Dev Platform
# Listens on port 1883 with password authentication
# Note: persistence is already configured in /etc/mosquitto/mosquitto.conf

# Network
listener 1883
protocol mqtt

# Authentication
allow_anonymous false
password_file /etc/mosquitto/passwd

# Logging
log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
